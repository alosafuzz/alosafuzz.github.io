<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
{% seo %}
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">alosafuzz</a>
  <div class="tag">{{ site.tagline }}</div>
  <nav class="main">
    <a href="{{ '/projects/' | relative_url }}">Projects</a>
    <a href="{{ '/guides/' | relative_url }}">Protocol Guides</a>
    <a href="{{ '/writeups/' | relative_url }}">Writeups</a>
    <a href="{{ '/advisories/' | relative_url }}">Advisories</a>
    <a href="{{ '/publications/' | relative_url }}">Publications</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </nav>
</div></header>
<main class="wrap">
{{ content }}
</main>
<footer class="site"><div class="wrap">
  © {{ 'now' | date: "%Y" }} Shad Malloy (alosafuzz) · ICS/OT protocol security research ·
  <a href="https://github.com/alosafuzz">github.com/alosafuzz</a>
</div></footer>
</body>
</html>
